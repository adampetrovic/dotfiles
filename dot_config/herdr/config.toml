onboarding = false

[ui]
window_title = "herdr: {workspace}"
status_indicators = "symbols"
pane_borders = "always"
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
prompt_new_tab_name = false
tab_bar_right = [
  { type = "datetime", format = "%H:%M" },
]

[theme]
name = "gruvbox"
auto_switch = false

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[keys]
prefix = "ctrl+a"
focus_pane_up = ""

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "herdr-bar"

[[keys.command]]
key = "prefix+enter"
type = "popup"
command = "zsh -l"
width = "80%"
height = "70%"
description = "floating zsh"

[[keys.command]]
key = "prefix+ctrl+j"
type = "popup"
command = "jjui"
width = "80%"
height = "70%"
description = "jjui"

[[keys.command]]
key = "prefix+j"
type = "popup"
command = "zsh -c 'cd ~/code/logseq && f=journals/$(date +%Y_%m_%d).md && touch \"$f\" && exec nvim \"$f\"'"
width = "80%"
height = "70%"
description = "logseq journal"
